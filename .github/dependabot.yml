# https://docs.github.com/en/code-security/reference/supply-chain-security/dependabot-options-reference
# 煞笔微软式中文传到 GitHub 文档上了，还用英文看吧，否则排版就是一团乱麻
version: 2

updates:
  # update npm packages
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "saturday"
    groups: # 分组，多依赖一个 Pull Request
      minor-and-patch: # 自定义 Identifier
        patterns:
          - "*"
        update-types: # Major Version 仍然一个依赖一个 PR
          - "minor"
          - "patch"
    open-pull-requests-limit: 3